<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local AI Study Assistant</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">SA</div>
        <div class="brand-text">
          <span class="brand-title">Study Assistant</span>
          <span class="brand-subtitle">local &amp; private</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard" class="nav-item">
          <span class="nav-icon">▤</span> Dashboard
        </a>
        <a href="#/library" data-route="library" class="nav-item">
          <span class="nav-icon">▥</span> Library
        </a>
        <a href="#/workspace" data-route="workspace" class="nav-item">
          <span class="nav-icon">▦</span> Study Workspace
        </a>
        <a href="#/chat" data-route="chat" class="nav-item">
          <span class="nav-icon">◔</span> AI Chat
        </a>
        <a href="#/quiz" data-route="quiz" class="nav-item">
          <span class="nav-icon">✓</span> Quiz
        </a>
        <a href="#/flashcards" data-route="flashcards" class="nav-item">
          <span class="nav-icon">◱</span> Flashcards
        </a>
        <a href="#/settings" data-route="settings" class="nav-item">
          <span class="nav-icon">⚙</span> Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="ollama-status" id="ollama-status-pill">
          <span class="status-dot status-dot--unknown"></span>
          <span class="status-text">Checking Ollama…</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙</button>
      </div>
    </aside>

    <main class="main">
      <div id="page-root" class="page-root"></div>
    </main>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/library.js"></script>
  <script src="/js/pages/workspace.js"></script>
  <script src="/js/pages/chat.js"></script>
  <script src="/js/pages/quiz.js"></script>
  <script src="/js/pages/flashcards.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
